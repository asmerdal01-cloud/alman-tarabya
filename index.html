<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenTree - GIS Tabanlı Kentsel Ekosistem Hizmetleri Takip Sistemi</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background-color: #161616; z-index: 1; }

        .sidebar { position: fixed; top: 20px; left: 15px; bottom: 20px; width: 310px; background-color: rgba(30, 30, 30, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; color: #e0e0e0; z-index: 1000; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .sidebar-header { padding: 25px 20px 15px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .sidebar-title { margin: 0; font-size: 24px; font-weight: 700; color: #ffffff; }
        .sidebar-subtitle { margin: 8px 0 0 0; font-size: 9.5px; color: #2ecc71; text-transform: uppercase; font-weight: 700; }
        .sidebar-content { padding: 15px; flex-grow: 1; overflow-y: auto; }

        .excel-kutu-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 5px; }
        .veri-kutusu { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 12px; text-align: center; }
        .veri-baslik { font-size: 10px; color: #999; text-transform: uppercase; margin-bottom: 6px; }
        .veri-deger { font-size: 16px; font-weight: 600; color: #ffffff; }

        .agac-popup-baslik { font-size: 14px; font-weight: 600; color: #2ecc71; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 6px; margin-bottom: 8px; }
        .agac-popup-satir { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; }
        
        .pulsing-marker { animation: pulse-marker 3s infinite ease-in-out; }
        @keyframes pulse-marker { 0% { stroke-width: 2; stroke-opacity: 0.8; } 50% { stroke-width: 10; stroke-opacity: 0.1; } 100% { stroke-width: 2; stroke-opacity: 0.8; } }
        
        .leaflet-popup-content-wrapper { background-color: rgba(25, 25, 25, 0.95) !important; color: #e0e0e0 !important; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">Project SenTree</div>
            <p class="sidebar-subtitle">Kentsel Ekosistem Hizmetleri Takip Sistemi</p>
        </div>
        <div class="sidebar-content">
            <div id="excel-verileri">Veriler yükleniyor...</div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        var map = L.map('map', { zoomControl: false, attributionControl: false, minZoom: 12 });
        map.setView([41.1350, 29.0614], 17);

        var markers = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 50 });

        // Veri temizleme fonksiyonu (Metin içindeki virgülleri noktaya çevirir)
        function clean(val) {
            if(!val) return 0;
            return parseFloat(val.toString().replace(',', '.').replace(' ', ''));
        }

        var csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgLRxnEhblACdZ6LTb4NINI8RwcLotC6j-h9AxTm1C0SffFWel0PnzOoUWE1Jh9tC1EUOWhGQE4gow/pub?gid=942754741&single=true&output=csv";

        Papa.parse(csvUrl, {
            download: true,
            header: false,
            complete: function(results) {
                var veriler = results.data;
                if(veriler && veriler.length > 1) {
                    var basliklar = veriler[0]; 
                    markers.clearLayers();

                    for (var i = 1; i < veriler.length; i++) {
                        var satir = veriler[i];
                        
                        // İSTEĞİNİZE GÖRE SÜTUNLAR:
                        // Enlem: H(7), Boylam: I(8), Simge Boyutu: F(5)
                        var lat = clean(satir[7]); 
                        var lng = clean(satir[8]); 
                        var simgeBoyutu = clean(satir[5]) || 8; // F sütunu boşsa varsayılan 8

                        if (!isNaN(lat) && !isNaN(lng) && lat !== 0) {
                            var popupHTML = "<div style='min-width:180px'><h3 class='agac-popup-baslik'>Biyometrik Analiz</h3>";
                            
                            // Popup'ta çıkacak veriler: A(0), B(1), C(2), G(6), H(7), I(8), J(9)
                            var popupSutunlari = [0, 1, 2, 6, 7, 8, 9];
                            popupSutunlari.forEach(idx => {
                                if(satir[idx]) {
                                    popupHTML += `<div class="agac-popup-satir"><span>${basliklar[idx]}</span><span style="font-weight:600">${satir[idx]}</span></div>`;
                                }
                            });
                            popupHTML += "</div>";

                            var marker = L.circleMarker([lat, lng], {
                                radius: simgeBoyutu, // F Sütunundaki değer
                                fillColor: "#2ecc71", 
                                color: "#ffffff", 
                                weight: 1.5, 
                                fillOpacity: 0.8, 
                                className: 'pulsing-marker'
                            }).bindPopup(popupHTML);

                            markers.addLayer(marker);
                        }
                    }
                    map.addLayer(markers);
                    map.fitBounds(markers.getBounds(), { padding: [50, 50] });

                    // SABİT PANEL VERİLERİ: K(10), L(11), M(12), N(13), O(14), P(15)
                    var panelSutunlari = [10, 11, 12, 13, 14, 15]; 
                    var sonSatir = veriler.find(row => row[10] && row[10].trim() !== ""); // K sütunu dolu olan satırı bul

                    if (sonSatir) {
                        var html = '<div class="excel-kutu-container">';
                        panelSutunlari.forEach(index => {
                            var val = sonSatir[index] ? sonSatir[index] : "0";
                            html += `<div class="veri-kutusu"><div class="veri-baslik">${basliklar[index]}</div><div class="veri-deger">${val}</div></div>`;
                        });
                        html += '</div>';
                        document.getElementById('excel-verileri').innerHTML = html;
                    }
                }
            }
        });
    </script>
</body>
</html>
