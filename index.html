<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTREE - SARSINTISIZ NİHAİ KİOSK</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background-color: #161616; z-index: 1; }

        .sidebar { position: fixed; top: 20px; left: 15px; bottom: 20px; width: 310px; background-color: rgba(40, 40, 40, 0.70); backdrop-filter: blur(15px) saturate(180%); -webkit-backdrop-filter: blur(15px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; color: #e0e0e0; z-index: 1000; display: flex; flex-direction: column; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .sidebar-header { padding: 25px 20px 20px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); background-color: rgba(0, 0, 0, 0.2); border-radius: 20px 20px 0 0; }
        .sidebar-title { margin: 0; font-size: 24px; font-weight: 700; color: #ffffff; letter-spacing: 0.5px; }
        .sidebar-location { margin: 4px 0 0 0; font-size: 13px; font-weight: 600; color: #ffffff; opacity: 0.8; }
        .sidebar-subtitle { margin: 12px 0 0 0; font-size: 9.5px; color: #2ecc71; text-transform: uppercase; letter-spacing: 0.8px; line-height: 1.4; font-weight: 700; }
        .sidebar-powered { text-align: right; margin-top: 15px; font-size: 9px; color: #777; font-style: italic; }
        .sidebar-content { padding: 15px; flex-grow: 1; overflow-y: auto; }

        .search-container { margin-top: 15px; position: relative; display: flex; gap: 8px; }
        .search-input { flex-grow: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px 15px; color: white; font-size: 13px; outline: none; transition: border 0.3s; }
        .search-input:focus { border-color: #2ecc71; }
        .search-input::placeholder { color: #888; }
        .search-btn { background: #2ecc71; color: #111; border: none; border-radius: 8px; padding: 0 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .search-btn:hover { background: #27ae60; }
        .search-results { margin-top: 8px; font-size: 12px; color: #ccc; }
        
        .clear-route-btn { display: none; margin-top: 5px; width: 100%; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; padding: 6px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; transition: 0.2s; }
        .clear-route-btn:hover { background: rgba(255, 255, 255, 0.2); }

        .top-clock-container { position: fixed; top: 20px; right: 20px; background-color: rgba(40, 40, 40, 0.70); backdrop-filter: blur(15px) saturate(180%); -webkit-backdrop-filter: blur(15px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 10px 14px; z-index: 1000; display: flex; flex-direction: column; align-items: center; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); pointer-events: none; }
        .time-text { font-size: 22px; font-weight: 700; letter-spacing: 1px; color: #2ecc71; line-height: 1; font-family: 'Segoe UI', monospace; text-align: center; }
        .date-text { font-size: 8.5px; font-weight: 600; color: #bbb; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.2px; text-align: center; }

        .excel-kutu-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .veri-kutusu { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 12px; text-align: center; position: relative; cursor: pointer; transition: transform 0.2s, background 0.2s; }
        .veri-kutusu:hover { background: rgba(255, 255, 255, 0.08); }
        .veri-kutusu:active { transform: scale(0.92); }
        .veri-baslik { font-size: 10px; color: #999; text-transform: uppercase; margin-bottom: 6px; pointer-events: none; }
        .veri-deger-container { display: flex; align-items: center; justify-content: center; gap: 6px; pointer-events: none; }
        .veri-deger { font-size: 16px; font-weight: 600; color: #ffffff; }
        .trend-up { color: #2ecc71; font-size: 14px; }
        .trend-down { color: #e74c3c; font-size: 14px; }
        .trend-flat { color: #95a5a6; font-size: 14px; }

        #iosModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 9999; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        #iosModal.show { opacity: 1; }
        #iosModalContent { width: 90%; max-width: 700px; height: 450px; background: rgba(30, 30, 30, 0.85); border-radius: 24px; border: 1px solid rgba(255,255,255,0.15); padding: 25px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); transform: scale(0); opacity: 0; transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.2), opacity 0.4s ease; position: relative; display: flex; flex-direction: column; }
        #iosModal.show #iosModalContent { transform: scale(1); opacity: 1; }
        .modal-baslik { color: white; margin: 0 0 15px 0; font-size: 18px; font-weight: 600; }
        .close-btn { position: absolute; top: 20px; right: 25px; color: #aaa; font-size: 28px; cursor: pointer; font-weight: bold; transition: color 0.2s; line-height: 1; }
        .close-btn:hover { color: #fff; }
        .chart-container { flex-grow: 1; position: relative; width: 100%; }

        .marker-cluster-small { background-color: rgba(46, 204, 113, 0.6); }
        .marker-cluster-small div { background-color: rgba(46, 204, 113, 0.8); color: #fff; font-weight: bold; }
        .zoom-guide { position: fixed; bottom: 30px; right: 30px; z-index: 1001; pointer-events: none; opacity: 0; transition: opacity 1s ease-in-out; display: flex; flex-direction: column; align-items: center; }
        .pinch-container { position: relative; width: 70px; height: 70px; background: rgba(255,255,255,0.03); border-radius: 50%; }
        .finger { position: absolute; width: 18px; height: 18px; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 50%; top: 50%; left: 50%; }
        .finger-1 { animation: pinch-move-1 3.5s infinite ease-in-out; }
        .finger-2 { animation: pinch-move-2 3.5s infinite ease-in-out; }
        @keyframes pinch-move-1 { 0%, 100% { transform: translate(-110%, -110%); opacity: 0.1; } 50% { transform: translate(-10%, -10%); opacity: 0.6; } }
        @keyframes pinch-move-2 { 0%, 100% { transform: translate(40%, 40%); opacity: 0.1; } 50% { transform: translate(-10%, -10%); opacity: 0.6; } }
        .zoom-text { color: white; font-size: 9px; margin-top: 12px; opacity: 0.4; letter-spacing: 1px; text-align: center; font-weight: 500; }
        @keyframes pulse-marker { 0% { stroke-width: 2; stroke-opacity: 0.8; } 50% { stroke-width: 12; stroke-opacity: 0.1; } 100% { stroke-width: 2; stroke-opacity: 0.8; } }
        .pulsing-marker { animation: pulse-marker 3s infinite ease-in-out; }
        .leaflet-popup-content-wrapper { background-color: rgba(25, 25, 25, 0.95) !important; backdrop-filter: blur(8px); color: #e0e0e0 !important; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .agac-popup-baslik { font-size: 14px; font-weight: 600; color: #2ecc71; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 6px; margin-bottom: 8px; }
        .agac-popup-satir { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">PROJECT SENTREE</div>
            <div class="sidebar-location">📍ALMAN BÜYÜKELÇİLİĞİ - TARABYA</div>
            <p class="sidebar-subtitle">GIS TABANLI KENTSEL EKOSİSTEM HİZMETLERİ TAKİP SİSTEMİ</p>
            
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Lokanta, Tuvalet ara..." onkeypress="handleKeyPress(event)">
                <button class="search-btn" onclick="searchLocation()">Ara</button>
            </div>
            <div id="searchResults" class="search-results"></div>
            <button id="clearRouteBtn" class="clear-route-btn" onclick="clearHighlight()">Vurguyu Temizle</button>

            <div class="sidebar-powered">Powered by CLIMERA Projects</div>
        </div>
        <div class="sidebar-content">
            <div id="excel-verileri">Veriler yükleniyor...</div>
        </div>
    </div>

    <div class="top-clock-container">
        <div class="time-text" id="liveTime">--:--:--</div>
        <div class="date-text" id="liveDate">SİSTEM BAĞLANTISI...</div>
    </div>

    <div id="iosModal" onclick="if(event.target == this) closeChart()"><div id="iosModalContent"><span class="close-btn" onclick="closeChart()">&times;</span><h3 class="modal-baslik" id="modalBaslik">Grafik Yükleniyor...</h3><div class="chart-container"><canvas id="chartCanvas"></canvas></div></div></div>
    <div id="zoomGuide" class="zoom-guide"><div class="pinch-container"><div class="finger finger-1"></div><div class="finger finger-2"></div></div><div class="zoom-text">ETKİLEŞİM İÇİN <br> DOKUNUN</div></div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        setInterval(() => {
            const now = new Date();
            const days = ["PAZAR", "PAZARTESİ", "SALI", "ÇARŞAMBA", "PERŞEMBE", "CUMA", "CUMARTESİ"];
            const months = ["OCAK", "ŞUBAT", "MART", "NİSAN", "MAYIS", "HAZİRAN", "TEMMUZ", "AĞUSTOS", "EYLÜL", "EKİM", "KASIM", "ARALIK"];
            document.getElementById('liveTime').innerText = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('liveDate').innerText = `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()} | ${days[now.getDay()]}`;
        }, 1000);

        proj4.defs("EPSG:5254", "+proj=tmerc +lat_0=0 +lon_0=30 +k=1 +x_0=500000 +y_0=0 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs");

        var rawKioskCoords = [421029.4472, 4556083.3033]; 
        var transformedKiosk = proj4("EPSG:5254", "EPSG:4326", rawKioskCoords);
        var kioskLatLng = L.latLng(transformedKiosk[1], transformedKiosk[0]);
        
        // AĞAÇ ANİMASYONLARI (PULSE) VE SINIRSIZ KAYDIRMA İÇİN GELİŞMİŞ SVG MOTORU
        var map = L.map('map', { 
            renderer: L.svg({ padding: 3.0 }), // Hem nefes alma efektini çalıştırır hem de kesilmeyi/gri boşlukları önler!
            zoomControl: false, 
            attributionControl: false, 
            minZoom: 12, 
            maxZoom: 25, 
            zoomSnap: 0.1, 
            zoomDelta: 0.1 
        }).setView(kioskLatLng, 19);
        
        var kioskIcon = L.divIcon({ html: '<div style="background-color:#3498db; width:16px; height:16px; border-radius:50%; border:3px solid white; box-shadow:0 0 10px rgba(0,0,0,0.5);"></div>', className: '', iconSize: [22, 22], iconAnchor: [11, 11] });
        L.marker(kioskLatLng, {icon: kioskIcon}).addTo(map).bindPopup("<b style='color:#3498db'>Şu An Buradasınız</b>", { closeButton: false }).openPopup();

        var aktifVurgularKatmani = L.featureGroup().addTo(map);

        var rawPoiListesi = [
            { ad: "tuvalet", tip: "polygon", coords: [ [420944.7015, 4555949.0085], [420953.7871, 4555942.5953], [420939.1770, 4555922.0605], [420929.9926, 4555928.9925] ] },
            { ad: "lokanta", tip: "point", x: 420962.2129, y: 4556130.5068 },
            { ad: "tuvalet", tip: "point", x: 420952.2674, y: 4556029.0993 }
        ];

        var poiListesi = rawPoiListesi.map(poi => {
            if (poi.tip === "polygon") {
                var latLngs = poi.coords.map(c => { var trans = proj4("EPSG:5254", "EPSG:4326", [c[0], c[1]]); return [trans[1], trans[0]]; });
                return { ad: poi.ad, tip: "polygon", latLngs: latLngs };
            } else {
                var trans = proj4("EPSG:5254", "EPSG:4326", [poi.x, poi.y]);
                return { ad: poi.ad, tip: "point", lat: trans[1], lng: trans[0] };
            }
        });

        function handleKeyPress(e) { if (e.key === 'Enter') searchLocation(); }

        var glowLayers = [];
        var animasyonZamanlayici = null;

        // JS Animasyonu (Kusursuz Neon Parlaması, Asla Titremez)
        function baslatJSAnimasyon() {
            var pulseOpacity = 0.2;
            var pulseDir = 0.04;
            animasyonZamanlayici = setInterval(() => {
                pulseOpacity += pulseDir;
                if(pulseOpacity > 0.6) { pulseOpacity = 0.6; pulseDir = -0.04; }
                if(pulseOpacity < 0.1) { pulseOpacity = 0.1; pulseDir = 0.04; }
                
                glowLayers.forEach(katman => {
                    if(katman.setStyle) { katman.setStyle({ opacity: pulseOpacity, fillOpacity: pulseOpacity / 2 }); }
                });
            }, 40); 
        }

        function searchLocation() {
            var searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            var resultsDiv = document.getElementById('searchResults');
            if (searchTerm.length < 2) { resultsDiv.innerHTML = "En az 2 harf girin."; return; }

            var foundPOIs = poiListesi.filter(poi => poi.ad.includes(searchTerm));

            if (foundPOIs.length > 0) {
                resultsDiv.innerHTML = ""; 
                aktifVurgularKatmani.clearLayers();
                glowLayers = []; 
                if(animasyonZamanlayici) clearInterval(animasyonZamanlayici);

                foundPOIs.forEach(poi => {
                    var coreLayer, glowLayer;
                    
                    if (poi.tip === "polygon") {
                        glowLayer = L.polygon(poi.latLngs, { color: '#e74c3c', weight: 14, opacity: 0.3, fillOpacity: 0.1, lineJoin: 'round', interactive: false });
                        coreLayer = L.polygon(poi.latLngs, { color: '#e74c3c', weight: 3, opacity: 1, fillOpacity: 0.7, interactive: false });
                    } else {
                        glowLayer = L.circleMarker([poi.lat, poi.lng], { radius: 18, color: 'transparent', fillColor: '#e74c3c', fillOpacity: 0.3, interactive: false });
                        coreLayer = L.circleMarker([poi.lat, poi.lng], { radius: 8, color: '#fff', weight: 2, fillColor: '#e74c3c', fillOpacity: 1, interactive: false });
                    }
                    
                    aktifVurgularKatmani.addLayer(glowLayer);
                    aktifVurgularKatmani.addLayer(coreLayer);
                    glowLayers.push(glowLayer); 
                });

                map.flyToBounds(aktifVurgularKatmani.getBounds(), { padding: [80, 80], maxZoom: 19.5, duration: 2.5 });
                document.getElementById('clearRouteBtn').style.display = 'block';
                
                baslatJSAnimasyon(); 

            } else {
                resultsDiv.innerHTML = `<span style="color:#aaa">Konum bulunamadı.</span>`;
            }
        }

        function clearHighlight() {
            if(animasyonZamanlayici) clearInterval(animasyonZamanlayici);
            glowLayers = [];
            aktifVurgularKatmani.clearLayers();
            document.getElementById('searchInput').value = "";
            document.getElementById('searchResults').innerHTML = "";
            document.getElementById('clearRouteBtn').style.display = 'none';
            
            // SARSINTI KİLİDİ 1: Eğer harita zaten Kiosk noktasındaysa, yerinden kıpırdatma!
            var dist = map.distance(map.getCenter(), kioskLatLng);
            if (map.getZoom() !== 19 || dist > 1.0) {
                map.flyTo(kioskLatLng, 19, { duration: 2 });
            }
        }

        var globalAnaKatman; 
        var markers = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 35, disableClusteringAtZoom: 40, chunkedLoading: true });

        fetch('veri.geojson').then(response => response.json()).then(data => {
            globalAnaKatman = L.geoJSON(data, { coordsToLatLng: function (coords) { var transformed = proj4("EPSG:5254", "EPSG:4326", [coords[0], coords[1]]); return new L.LatLng(transformed[1], transformed[0]); }, style: { color: "darkgray", weight: 1, opacity: 0.6, fillColor: "gray", fillOpacity: 0.1 } }).addTo(map);
        }).catch(err => console.error("GeoJSON yüklenemedi:", err));

        var csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgLRxnEhblACdZ6LTb4NINI8RwcLotC6j-h9AxTm1C0SffFWel0PnzOoUWE1Jh9tC1EUOWhGQE4gow/pub?gid=942754741&single=true&output=csv";
        Papa.parse(csvUrl, {
            download: true, header: false,
            complete: function(results) {
                var veriler = results.data;
                if(veriler && veriler.length > 1) {
                    var basliklar = veriler[0]; markers.clearLayers();
                    for (var i = 1; i < veriler.length; i++) {
                        var satir = veriler[i];
                        var rawY = parseFloat(satir[7] ? satir[7].toString().replace(',', '.') : "NaN"); 
                        var rawX = parseFloat(satir[8] ? satir[8].toString().replace(',', '.') : "NaN"); 
                        var simgeBoyutu = parseFloat(satir[5] ? satir[5].toString().replace(',', '.') : "8");
                        if (!isNaN(rawY) && !isNaN(rawX) && rawY > 1000 && rawX > 1000) {
                            var convertedCoords = proj4("EPSG:5254", "EPSG:4326", [rawX, rawY]);
                            var lng = convertedCoords[0], lat = convertedCoords[1]; 
                            var popupHTML = "<div style='min-width:180px'><h3 class='agac-popup-baslik'>Biyometrik Analiz</h3>";
                            [0, 1, 2, 6, 7, 8, 9].forEach(idx => { if(satir[idx]) popupHTML += `<div class="agac-popup-satir"><span>${basliklar[idx]}</span><span style="font-weight:600">${satir[idx]}</span></div>`; });
                            popupHTML += "</div>";
                            var marker = L.circleMarker([lat, lng], { radius: simgeBoyutu || 8, fillColor: "#2ecc71", color: "#2ecc71", weight: 2, fillOpacity: 0.8, className: 'pulsing-marker' }).bindPopup(popupHTML);
                            markers.addLayer(marker);
                        }
                    }
                    map.addLayer(markers);

                    var panelSutunlari = [10, 11, 12, 13, 14, 15]; var eskiVeriSutunlari = [16, 17, 18, 19, 20, 21]; var birimler = { 10: "ton", 11: "ton", 12: "ton", 13: "TL", 14: "", 15: "adet" };
                    var sonGuncelVeri = veriler.slice().reverse().find(row => row && row[10] && row[10].toString().trim() !== "");
                    if (sonGuncelVeri) {
                        var ibreliSayisi = parseInt(sonGuncelVeri[22]) || 0; var yaprakliSayisi = parseInt(sonGuncelVeri[23]) || 0;
                        var html = '<div class="excel-kutu-container">';
                        panelSutunlari.forEach((index, i) => {
                            var mevcutSayi = parseFloat((sonGuncelVeri[index] || "0").toString().trim().replace(',', '.'));
                            var eskiSayi = parseFloat((sonGuncelVeri[eskiVeriSutunlari[i]] || "NaN").toString().trim().replace(',', '.'));
                            var baslikAdi = basliklar[index] || `-`;
                            var birimMetni = birimler[index] ? `<span style='font-size:10px; color:#888; margin-left:3px;'>${birimler[index]}</span>` : "";
                            var trendIcon = !isNaN(mevcutSayi) && !isNaN(eskiSayi) ? (mevcutSayi > eskiSayi ? "<span class='trend-up' style='margin-left:5px;'>▲</span>" : (mevcutSayi < eskiSayi ? "<span class='trend-down' style='margin-left:5px;'>▼</span>" : "<span class='trend-flat' style='margin-left:5px;'>▬</span>")) : "";
                            html += `<div class="veri-kutusu" onclick="openChart(event, this)" data-baslik="${baslikAdi}" data-mevcut="${mevcutSayi}" data-eski="${eskiSayi}" data-birim="${birimler[index]}" data-ibreli="${ibreliSayisi}" data-yaprakli="${yaprakliSayisi}"><div class="veri-baslik">${baslikAdi}</div><div class="veri-deger-container"><span class="veri-deger">${sonGuncelVeri[index]||"0"}</span>${birimMetni}${trendIcon}</div></div>`;
                        });
                        html += '</div>';
                        document.getElementById('excel-verileri').innerHTML = html;
                    }
                }
            }
        });

        var currentChart = null;
        function openChart(event, element) {
            var baslik = element.getAttribute('data-baslik'); var mevcut = parseFloat(element.getAttribute('data-mevcut')); var eski = parseFloat(element.getAttribute('data-eski')); var birim = element.getAttribute('data-birim'); var ibreli = parseInt(element.getAttribute('data-ibreli')) || 0; var yaprakli = parseInt(element.getAttribute('data-yaprakli')) || 0;
            if (birim === "undefined") birim = "";
            var rect = element.getBoundingClientRect(); var originX = rect.left + (rect.width / 2); var originY = rect.top + (rect.height / 2);
            var modal = document.getElementById('iosModal'); var modalContent = document.getElementById('iosModalContent');
            document.getElementById('modalBaslik').innerText = baslik + " Karşılaştırması";
            modal.style.display = 'flex'; modalContent.style.transformOrigin = `${originX}px ${originY}px`;
            setTimeout(() => { modal.classList.add('show'); }, 10);
            if(currentChart) currentChart.destroy();
            var ctx = document.getElementById('chartCanvas').getContext('2d'); var isTreeCount = baslik.toLocaleLowerCase('tr-TR').includes("ağaç");
            
            if (isTreeCount && (ibreli > 0 || yaprakli > 0)) {
                // AĞAÇ TÜRLERİ İÇİN OLAN RENKLER (Yeşil, Turuncu, Mor)
                var chartLabels = isNaN(eski) ? ['Mevcut Dönem'] : ['Önceki Dönem', 'Mevcut Dönem']; var diger = mevcut - (ibreli + yaprakli); if (diger < 0) diger = 0;
                var datasets = [];
                if (!isNaN(eski)) { datasets.push({ label: 'Geçmiş Toplam', data: [eski, 0], backgroundColor: '#95a5a6', borderRadius: 4 }); datasets.push({ label: 'İbreli', data: [0, ibreli], backgroundColor: '#27ae60', borderRadius: 4 }); datasets.push({ label: 'Yapraklı', data: [0, yaprakli], backgroundColor: '#f39c12', borderRadius: 4 }); if(diger > 0) datasets.push({ label: 'Diğer', data: [0, diger], backgroundColor: '#8e44ad', borderRadius: 4 });
                } else { datasets.push({ label: 'İbreli', data: [ibreli], backgroundColor: '#27ae60', borderRadius: 4 }); datasets.push({ label: 'Yapraklı', data: [yaprakli], backgroundColor: '#f39c12', borderRadius: 4 }); if(diger > 0) datasets.push({ label: 'Diğer', data: [diger], backgroundColor: '#8e44ad', borderRadius: 4 }); }
                currentChart = new Chart(ctx, { type: 'bar', data: { labels: chartLabels, datasets: datasets }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true, labels: {color: '#eee'} } }, scales: { x: { stacked: true, ticks: { color: '#eee', font: {size: 13, weight: 'bold'} }, grid: { display: false } }, y: { stacked: true, beginAtZero: true, ticks: { color: '#bbb' }, grid: { color: 'rgba(255,255,255,0.05)' } } } } });
            } else {
                // DİĞER STANDART VERİLER İÇİN OLAN RENKLER (Kırmızı iptal, Sentree Yeşili eklendi)
                var chartLabels = isNaN(eski) ? ['Mevcut Dönem'] : ['Önceki Dönem', 'Mevcut Dönem']; var chartData = isNaN(eski) ? [mevcut] : [eski, mevcut]; 
                var chartColors = isNaN(eski) ? ['#2ecc71'] : ['#95a5a6', '#2ecc71']; 
                currentChart = new Chart(ctx, { type: 'bar', data: { labels: chartLabels, datasets: [{ label: birim ? `Birim: ${birim}` : 'Değer', data: chartData, backgroundColor: chartColors, borderRadius: 8, barPercentage: 0.5 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { color: '#bbb', font: {size: 11} }, grid: { color: 'rgba(255,255,255,0.05)' } }, x: { ticks: { color: '#eee', font: {size: 13, weight: 'bold'} }, grid: { display: false } } } } });
            }
        }
        function closeChart() { document.getElementById('iosModal').classList.remove('show'); setTimeout(() => { document.getElementById('iosModal').style.display = 'none'; }, 400); }
        
        // --- 15 SANİYE KURALI (SARSINTI KİLİDİ 2) ---
        var idleTimer; 
        function resetInteraction() { 
            // Eğer bir vurgu yoksa veya harita zaten merkezdeyse hiçbir işlem yapma
            var dist = map.distance(map.getCenter(), kioskLatLng);
            if (aktifVurgularKatmani.getLayers().length > 0 || map.getZoom() !== 19 || dist > 1.0) {
                clearHighlight(); 
                map.closePopup(); 
            }
        }
        function handleInteraction() { 
            clearTimeout(idleTimer); 
            idleTimer = setTimeout(resetInteraction, 15000); 
        }

        document.addEventListener('touchstart', handleInteraction, {passive: true}); 
        document.addEventListener('mousedown', handleInteraction); 
        document.addEventListener('keydown', handleInteraction); 
        map.on('zoomstart', handleInteraction); 
        map.on('dragstart', handleInteraction);
        
        handleInteraction();

    </script>
</body>
</html>
