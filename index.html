<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenTree - Veri Tipi Düzeltme Modu</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; background: #111; }
        #map { height: 100vh; width: 100vw; }
        .sidebar { position: fixed; top: 20px; left: 15px; bottom: 20px; width: 310px; background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(10px); border-radius: 20px; color: white; z-index: 1000; display: flex; flex-direction: column; padding: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .excel-kutu-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .veri-kutusu { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .veri-baslik { font-size: 9px; color: #aaa; text-transform: uppercase; }
        .veri-deger { font-size: 15px; font-weight: bold; color: #2ecc71; }
        .agac-popup-satir { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 style="margin:0; font-size:22px;">SenTree</h2>
        <p style="font-size:10px; color:#2ecc71; margin:5px 0;">VERİ TİPİ KONTROLÜ AKTİF</p>
        <hr style="width:100%; opacity:0.1; margin:15px 0;">
        <div id="status" style="font-size:12px;">Excel aranıyor...</div>
        <div id="excel-verileri"></div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([41.1350, 29.0614], 17);
        var markers = L.markerClusterGroup();

        // METİN OLARAK GÖRÜNEN VERİYİ SAYIYA ÇEVİREN ÖZEL FONKSİYON
        function sayiyaCevir(deger) {
            if (!deger) return 0;
            // Metindeki tırnakları sil, boşlukları sil, virgülü noktaya çevir
            var temizVeri = deger.toString().replace(/[ "]/g, '').replace(',', '.');
            var sonuc = parseFloat(temizVeri);
            return isNaN(sonuc) ? 0 : sonuc;
        }

        var csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgLRxnEhblACdZ6LTb4NINI8RwcLotC6j-h9AxTm1C0SffFWel0PnzOoUWE1Jh9tC1EUOWhGQE4gow/pub?gid=942754741&single=true&output=csv";

        Papa.parse(csvUrl, {
            download: true,
            header: false,
            skipEmptyLines: true,
            complete: function(results) {
                var veriler = results.data;
                var status = document.getElementById('status');
                
                if (veriler.length > 0) {
                    var basliklar = veriler[0];
                    markers.clearLayers();
                    var sayac = 0;

                    for (var i = 1; i < veriler.length; i++) {
                        var satir = veriler[i];
                        
                        // H(7) ve I(8) sütunlarını sayıya zorla
                        var lat = sayiyaCevir(satir[7]); 
                        var lng = sayiyaCevir(satir[8]); 
                        var size = sayiyaCevir(satir[5]) || 8; 

                        if (lat !== 0 && lng !== 0) {
                            var popup = `<div style='min-width:160px'><b style='color:#2ecc71'>${satir[1]}</b><hr>`;
                            [2,3,4,9].forEach(idx => {
                                if(satir[idx]) popup += `<div class="agac-popup-satir"><span>${basliklar[idx]}</span><b>${satir[idx]}</b></div>`;
                            });
                            popup += `</div>`;

                            var marker = L.circleMarker([lat, lng], {
                                radius: size,
                                fillColor: "#2ecc71",
                                color: "#fff",
                                weight: 1,
                                fillOpacity: 0.8
                            }).bindPopup(popup);

                            markers.addLayer(marker);
                            sayac++;
                        }
                    }
                    map.addLayer(markers);
                    status.innerHTML = `✅ ${sayac} Ağaç başarıyla sayısallaştırıldı.`;
                    if(sayac > 0) map.fitBounds(markers.getBounds(), {padding:[50,50]});

                    // Panel Verileri (K, L, M, N, O, P)
                    var panelIndexleri = [10, 11, 12, 13, 14, 15];
                    var sonSatir = veriler.find(r => r[10] && r[10] !== "");
                    
                    if(sonSatir) {
                        var html = '<div class="excel-kutu-container">';
                        panelIndexleri.forEach(idx => {
                            html += `<div class="veri-kutusu">
                                <div class="veri-baslik">${basliklar[idx] || '-'}</div>
                                <div class="veri-deger">${sonSatir[idx] || '0'}</div>
                            </div>`;
                        });
                        html += '</div>';
                        document.getElementById('excel-verileri').innerHTML = html;
                    }
                }
            },
            error: function() {
                status.innerHTML = "❌ Excel bağlantı hatası!";
            }
        });
    </script>
</body>
</html>
