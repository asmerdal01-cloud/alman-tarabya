<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenTree - Kesin Çözüm Modu</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background-color: #111; }
        .sidebar { position: fixed; top: 15px; left: 15px; width: 300px; bottom: 15px; background: rgba(20,20,20,0.9); color: white; z-index: 1000; border-radius: 15px; padding: 15px; display: flex; flex-direction: column; border: 1px solid #333; }
        .excel-kutu-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .veri-kutusu { background: #222; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #444; }
        .veri-baslik { font-size: 10px; color: #888; text-transform: uppercase; }
        .veri-deger { font-size: 16px; font-weight: bold; color: #2ecc71; margin-top: 5px; }
        .agac-popup-satir { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; border-bottom: 1px solid #333; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="margin:0; font-size:20px;">Project SenTree</h2>
        <div id="status" style="font-size:11px; color:#aaa; margin-top:5px;">Veri aranıyor...</div>
        <div id="excel-verileri" style="margin-top:20px; flex-grow:1; overflow-y:auto;"></div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([41.1350, 29.0614], 16);
        var markers = L.markerClusterGroup();
        
        // CSV URL (Burayı kendi GID numaranızla güncellemeyi unutmayın)
        var csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgLRxnEhblACdZ6LTb4NINI8RwcLotC6j-h9AxTm1C0SffFWel0PnzOoUWE1Jh9tC1EUOWhGQE4gow/pub?gid=942754741&single=true&output=csv";

        function temizle(val) {
            if(!val) return 0;
            // Tırnakları, boşlukları temizle ve virgülü noktaya çevir
            return val.toString().replace(/"/g, '').replace(/ /g, '').replace(',', '.');
        }

        Papa.parse(csvUrl, {
            download: true,
            header: true, // Sütunları isimle çağırmak için true yaptık
            skipEmptyLines: true,
            complete: function(results) {
                var data = results.data;
                document.getElementById('status').innerText = data.length + " ağaç bulundu. İşleniyor...";

                data.forEach(function(row) {
                    // Sütun isimlerine göre veri çekme (Hata payını sıfırlar)
                    var lat = parseFloat(temizle(row["Enlem"]));
                    var lng = parseFloat(temizle(row["Boylam"]));
                    var boy = parseFloat(temizle(row["Tepe Tacı Çapı"])) || 5;

                    if (!isNaN(lat) && !isNaN(lng)) {
                        var p = "<div style='color:white; background:#111; padding:5px;'>";
                        p += "<b>" + (row["Ağaç Türü"] || "Bilinmiyor") + "</b><hr>";
                        p += "<div class='agac-popup-satir'><span>Boy:</span><span>" + row["Ağaç Boyu"] + "</span></div>";
                        p += "<div class='agac-popup-satir'><span>Çap:</span><span>" + row["Gövde Çapı"] + "</span></div>";
                        p += "</div>";

                        var m = L.circleMarker([lat, lng], {
                            radius: boy,
                            fillColor: "#2ecc71",
                            color: "#fff",
                            weight: 1,
                            fillOpacity: 0.7
                        }).bindPopup(p);
                        markers.addLayer(m);
                    }
                });

                map.addLayer(markers);
                if(markers.getLayers().length > 0) map.fitBounds(markers.getBounds());

                // Panel Verileri (K, L, M, N, O sütunları için son satırı bul)
                var son = data[0]; // Sizin tabloda veriler genelde ilk satırda toplanmış
                var panelHtml = '<div class="excel-kutu-container">';
                var hedefler = ["Mevcut CO2 Stoku", "Yıllık CO2 Stok Artışı", "Yıllık O2 Üretimi", "Mevcut CO2 Piyasa Değeri", "Mevcut Ağaç Sayısı"];
                
                hedefler.forEach(function(h) {
                    var deger = son[h] || "0";
                    panelHtml += `<div class="veri-kutusu"><div class="veri-baslik">${h}</div><div class="veri-deger">${deger}</div></div>`;
                });
                panelHtml += '</div>';
                document.getElementById('excel-verileri').innerHTML = panelHtml;
            },
            error: function(err) {
                document.getElementById('status').innerHTML = "<b style='color:red'>Bağlantı Hatası!</b>";
            }
        });
    </script>
</body>
</html>
