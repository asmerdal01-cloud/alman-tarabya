<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTREE - BIO-DİJİTAL İKİZ KONTROL MERKEZİ</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; background-color: #f0f2f5; }
        #map { height: 100vh; width: 100vw; background-color: #e5e7eb; z-index: 1; }

        /* AKIŞKAN VE OTOMATİK SIĞAN SOL PANEL (AÇIK TEMA) */
        .sidebar { 
            position: fixed; top: clamp(15px, 2vh, 25px); left: clamp(10px, 1.5vw, 20px); width: clamp(260px, 22vw, 360px); 
            max-height: calc(100vh - clamp(30px, 4vh, 50px)); height: fit-content; 
            background-color: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px) saturate(180%); -webkit-backdrop-filter: blur(15px) saturate(180%); 
            border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 20px; color: #333; z-index: 1000; 
            display: flex; flex-direction: column; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); 
        }
        .sidebar-header { padding: clamp(15px, 2vh, 25px) clamp(15px, 1.5vw, 20px) clamp(15px, 2vh, 20px); border-bottom: 1px solid rgba(0, 0, 0, 0.08); background-color: rgba(0, 0, 0, 0.03); border-radius: 20px 20px 0 0; }
        
        .sidebar-title { margin: 0; font-size: clamp(18px, 1.6vw, 26px); font-weight: 700; color: #111; letter-spacing: 0.5px; }
        .sidebar-location { margin: 4px 0 0 0; font-size: clamp(11px, 0.9vw, 14px); font-weight: 600; color: #444; opacity: 0.8; }
        
        .sidebar-subtitle { 
            margin: clamp(8px, 1vh, 12px) 0 0 0; font-size: clamp(6.5px, 0.6vw, 9.5px); color: #27ae60; text-transform: uppercase; 
            letter-spacing: 0.5px; line-height: 1.4; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
        }
        
        .sidebar-powered { text-align: right; margin-top: clamp(10px, 1.5vh, 15px); font-size: clamp(8px, 0.6vw, 10px); color: #777; font-style: italic; }
        .sidebar-content { padding: clamp(10px, 1vw, 15px); flex-grow: 1; overflow-y: auto; }

        /* ARAMA KUTUSU VE İÇİNE GÖMÜLÜ ÇARPI İŞARETİ (AÇIK TEMA) */
        .search-container { margin-top: clamp(10px, 1.5vh, 15px); position: relative; display: flex; gap: 8px; }
        .search-input-wrapper { position: relative; flex-grow: 1; display: flex; align-items: center; }
        .search-input { width: 100%; background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0,0,0,0.2); border-radius: 8px; padding: clamp(8px, 1vh, 12px) clamp(25px, 2.5vw, 30px) clamp(8px, 1vh, 12px) clamp(10px, 1vw, 15px); color: #111; font-size: clamp(11px, 0.9vw, 14px); outline: none; transition: all 0.3s ease; box-sizing: border-box; }
        .search-input:focus { border-color: #27ae60; }
        .search-input::placeholder { color: #888; }
        .search-btn { background: #2ecc71; color: #111; border: none; border-radius: 8px; padding: 0 clamp(10px, 1vw, 15px); font-size: clamp(11px, 0.9vw, 14px); font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .search-btn:hover { background: #27ae60; color: #fff; }
        .search-results { margin-top: 8px; font-size: clamp(10px, 0.8vw, 12px); color: #555; }
        
        .clear-search-btn { display: none; position: absolute; right: 10px; color: #888; font-size: 20px; cursor: pointer; font-weight: bold; line-height: 1; transition: color 0.2s; }
        .clear-search-btn:hover { color: #e74c3c; }

        /* DEMO FİLTRE BUTONLARI (Isı ve Polen - AÇIK TEMA) */
        .demo-filters { display: flex; gap: 8px; margin-top: 12px; }
        .demo-btn { flex: 1; background: rgba(0, 0, 0, 0.04); border: 1px solid rgba(0, 0, 0, 0.1); color: #555; border-radius: 6px; padding: 8px 4px; font-size: clamp(9.5px, 0.8vw, 11px); font-weight: bold; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .demo-btn:hover { background: rgba(0, 0, 0, 0.08); }
        .demo-btn.active-heat { background: rgba(231, 76, 60, 0.15); border-color: #e74c3c; color: #c0392b; }
        .demo-btn.active-pollen { background: rgba(241, 196, 15, 0.2); border-color: #f39c12; color: #d35400; }

        /* SAAT KUTUSU (AÇIK TEMA) */
        .top-clock-container { position: fixed; top: clamp(15px, 2vh, 25px); right: clamp(15px, 1.5vw, 25px); background-color: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px) saturate(180%); -webkit-backdrop-filter: blur(15px) saturate(180%); border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 12px; padding: clamp(8px, 1vh, 12px) clamp(10px, 1vw, 16px); z-index: 1000; display: flex; flex-direction: column; align-items: center; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1); pointer-events: none; }
        .time-text { font-size: clamp(18px, 1.5vw, 24px); font-weight: 700; letter-spacing: 1px; color: #27ae60; line-height: 1; font-family: 'Segoe UI', monospace; text-align: center; }
        .date-text { font-size: clamp(7.5px, 0.6vw, 9.5px); font-weight: 600; color: #666; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.2px; text-align: center; }
        
        /* SAĞ KONTROL MENÜSÜ (GPS BUTONU - AÇIK TEMA) */
        .right-controls { position: fixed; top: clamp(85px, 12vh, 110px); right: clamp(15px, 1.5vw, 25px); z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .control-btn { 
            background-color: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0, 0, 0, 0.15); 
            backdrop-filter: blur(10px); color: #27ae60; 
            width: clamp(40px, 4vw, 50px); height: clamp(40px, 4vw, 50px); 
            border-radius: 50%; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
            transition: all 0.2s; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1); 
        }
        .control-btn:hover { background-color: rgba(46, 204, 113, 0.1); transform: scale(1.1); color: #111; }
        .control-btn:active { transform: scale(0.9); }
        .control-btn svg { width: 50%; height: 50%; }

        /* EŞİT BOYUTLU KUTUCUKLAR (AÇIK TEMA) */
        .excel-kutu-container { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(8px, 1vw, 12px); margin-top: clamp(10px, 1.5vh, 15px); }
        .veri-kutusu { 
            background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 12px; 
            padding: clamp(8px, 1vh, 12px); text-align: center; position: relative; cursor: pointer; transition: all 0.3s ease; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: clamp(65px, 8vh, 85px); 
        }
        .veri-kutusu:hover { background: rgba(255, 255, 255, 0.9); border-color: rgba(0,0,0,0.15); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .veri-kutusu:active { transform: scale(0.92); }
        .veri-baslik { font-size: clamp(8px, 0.7vw, 11px); color: #666; text-transform: uppercase; margin-bottom: 6px; pointer-events: none; font-weight: 600; }
        .veri-deger-container { display: flex; align-items: center; justify-content: center; gap: 6px; pointer-events: none; }
        .veri-deger { font-size: clamp(14px, 1.2vw, 18px); font-weight: 700; color: #111; }
        .trend-up { color: #27ae60; font-size: clamp(12px, 1vw, 14px); }
        .trend-down { color: #e74c3c; font-size: clamp(12px, 1vw, 14px); }
        .trend-flat { color: #7f8c8d; font-size: clamp(12px, 1vw, 14px); }

        .veri-kutusu.tam-genislik { grid-column: span 2; background: linear-gradient(135deg, rgba(46, 204, 113, 0.15) 0%, rgba(46, 204, 113, 0.02) 100%); border: 1px solid rgba(46, 204, 113, 0.3); }
        .veri-kutusu.tam-genislik .veri-baslik { color: #27ae60; font-weight: bold; letter-spacing: 1px; }
        .veri-kutusu.tam-genislik .veri-deger { font-size: clamp(18px, 1.6vw, 24px); color: #111; }

        /* MODAL GRAFİK PENCERESİ (AÇIK TEMA) */
        #iosModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.2); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 9999; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        #iosModal.show { opacity: 1; }
        #iosModalContent { width: 90%; max-width: clamp(400px, 50vw, 750px); height: clamp(300px, 50vh, 500px); background: rgba(255, 255, 255, 0.95); border-radius: 24px; border: 1px solid rgba(0,0,0,0.1); padding: clamp(15px, 2vw, 25px); box-shadow: 0 25px 50px rgba(0,0,0,0.2); transform: scale(0); opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2); position: relative; display: flex; flex-direction: column; }
        #iosModal.show #iosModalContent { transform: scale(1); opacity: 1; }
        .modal-baslik { color: #111; margin: 0 0 clamp(10px, 1.5vh, 15px) 0; font-size: clamp(16px, 1.5vw, 20px); font-weight: 700; }
        .close-btn { position: absolute; top: clamp(15px, 2vh, 20px); right: clamp(15px, 2vw, 25px); color: #666; font-size: clamp(24px, 2vw, 28px); cursor: pointer; font-weight: bold; transition: color 0.2s; line-height: 1; }
        .close-btn:hover { color: #111; }
        .chart-container { flex-grow: 1; position: relative; width: 100%; }

        /* LEAFLET ÖZELLEŞTİRMELERİ (AÇIK TEMA POPUP) */
        .marker-cluster-small { background-color: rgba(46, 204, 113, 0.6); }
        .marker-cluster-small div { background-color: rgba(46, 204, 113, 0.8); color: #fff; font-weight: bold; font-size: clamp(10px, 0.8vw, 12px); }
        
        .leaflet-popup-content-wrapper { background-color: rgba(255, 255, 255, 0.95) !important; backdrop-filter: blur(8px); color: #333 !important; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .agac-popup-baslik { font-size: clamp(12px, 1vw, 14px); font-weight: 700; color: #27ae60; border-bottom: 1px solid rgba(0, 0, 0, 0.1); padding-bottom: 6px; margin-bottom: 8px; }
        .agac-popup-satir { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: clamp(10px, 0.8vw, 12px); color: #444; }

        /* DAİRESEL MERKEZİ RADAR TARAMASI (AÇIK TEMA UYUMLU, KISIK) */
        .kiosk-wrapper { position: relative; }
        
        .kiosk-core-dot {
            background-color: #3498db; width: 16px; height: 16px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.3);
            position: absolute; top: 0; left: 0; z-index: 10;
        }
        
        .kiosk-radar-container {
            position: absolute; top: 11px; left: 11px; width: 0; height: 0; z-index: -1;
        }
        
        .kiosk-radar-sweep {
            position: absolute; top: -1500px; left: -1500px; width: 3000px; height: 3000px; border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0%, transparent 75%, rgba(46, 204, 113, 0.05) 90%, rgba(46, 204, 113, 0.35) 100%);
            animation: radar-spin 5s linear infinite; pointer-events: none;
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 25%, rgba(0,0,0,0) 50%);
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 25%, rgba(0,0,0,0) 50%);
            mix-blend-mode: normal; 
            opacity: 0.4; transition: opacity 2s ease-in; 
        }
        
        @keyframes radar-spin { 
            from { transform: rotate(0deg); } 
            to { transform: rotate(360deg); } 
        }

        body.interacting .kiosk-radar-sweep {
            opacity: 0 !important;
            transition: opacity 0.3s ease-out; 
        }

    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">PROJECT SENTREE</div>
