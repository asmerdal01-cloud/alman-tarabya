<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTREE - BIO-DİJİTAL İKİZ KONTROL MERKEZİ</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; transition: background-color 0.4s ease; }
        #map { height: 100vh; width: 100vw; background-color: #161616; z-index: 1; transition: background-color 0.4s ease; }

        /* AKIŞKAN VE OTOMATİK SIĞAN SOL PANEL */
        .sidebar { 
            position: fixed; top: clamp(15px, 2vh, 25px); left: clamp(10px, 1.5vw, 20px); width: clamp(260px, 22vw, 360px); 
            max-height: calc(100vh - clamp(30px, 4vh, 50px)); height: fit-content; 
            background-color: rgba(40, 40, 40, 0.70); backdrop-filter: blur(15px) saturate(180%); -webkit-backdrop-filter: blur(15px) saturate(180%); 
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; color: #e0e0e0; z-index: 1000; 
            display: flex; flex-direction: column; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
            transition: all 0.4s ease;
        }
        .sidebar-header { padding: clamp(15px, 2vh, 25px) clamp(15px, 1.5vw, 20px) clamp(15px, 2vh, 20px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); background-color: rgba(0, 0, 0, 0.2); border-radius: 20px 20px 0 0; transition: background-color 0.4s ease; }
        
        .sidebar-title { margin: 0; font-size: clamp(18px, 1.6vw, 26px); font-weight: 700; color: #ffffff; letter-spacing: 0.5px; transition: color 0.4s ease; }
        .sidebar-location { margin: 4px 0 0 0; font-size: clamp(11px, 0.9vw, 14px); font-weight: 600; color: #ffffff; opacity: 0.8; transition: color 0.4s ease; }
        
        .sidebar-subtitle { 
            margin: clamp(8px, 1vh, 12px) 0 0 0; font-size: clamp(6.5px, 0.6vw, 9.5px); color: #2ecc71; text-transform: uppercase; 
            letter-spacing: 0.5px; line-height: 1.4; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
        }
        
        .sidebar-powered { text-align: right; margin-top: clamp(10px, 1.5vh, 15px); font-size: clamp(8px, 0.6vw, 10px); color: #777; font-style: italic; }
        .sidebar-content { padding: clamp(10px, 1vw, 15px); flex-grow: 1; overflow-y: auto; }

        /* ARAMA KUTUSU VE FİLTRELER */
        .search-container { margin-top: clamp(10px, 1.5vh, 15px); position: relative; display: flex; gap: 8px; }
        .search-input-wrapper { position: relative; flex-grow: 1; display: flex; align-items: center; }
        .search-input { width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: clamp(8px, 1vh, 12px) clamp(25px, 2.5vw, 30px) clamp(8px, 1vh, 12px) clamp(10px, 1vw, 15px); color: white; font-size: clamp(11px, 0.9vw, 14px); outline: none; transition: all 0.3s ease; box-sizing: border-box; }
        .search-input:focus { border-color: #2ecc71; }
        .search-input::placeholder { color: #888; }
        .search-btn { background: #2ecc71; color: #111; border: none; border-radius: 8px; padding: 0 clamp(10px, 1vw, 15px); font-size: clamp(11px, 0.9vw, 14px); font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .search-btn:hover { background: #27ae60; }
        .search-results { margin-top: 8px; font-size: clamp(10px, 0.8vw, 12px); color: #ccc; transition: color 0.4s ease; }
        .clear-search-btn { display: none; position: absolute; right: 10px; color: #aaa; font-size: 20px; cursor: pointer; font-weight: bold; line-height: 1; transition: color 0.2s; }
        .clear-search-btn:hover { color: #e74c3c; }

        /* YENİ: ÇEVRESEL FİLTRE BUTONLARI */
        .filter-buttons { display: flex; gap: 8px; margin-top: 12px; }
        .filter-btn { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); color: #ccc; border-radius: 6px; padding: 8px 4px; font-size: clamp(9px, 0.7vw, 11px); font-weight: bold; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .filter-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .filter-btn.active-heat { background: rgba(231, 76, 60, 0.2); border-color: #e74c3c; color: #ff7675; }
        .filter-btn.active-pollen { background: rgba(241, 196, 15, 0.2); border-color: #f1c40f; color: #ffeaa7; }

        /* SAAT KUTUSU */
        .top-clock-container { position: fixed; top: clamp(15px, 2vh, 25px); right: clamp(15px, 1.5vw, 25px); background-color: rgba(40, 40, 40, 0.70); backdrop-filter: blur(15px) saturate(180%); -webkit-backdrop-filter: blur(15px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: clamp(8px, 1vh, 12px) clamp(10px, 1vw, 16px); z-index: 1000; display: flex; flex-direction: column; align-items: center; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); pointer-events: none; transition: all 0.4s ease; }
        .time-text { font-size: clamp(18px, 1.5vw, 24px); font-weight: 700; letter-spacing: 1px; color: #2ecc71; line-height: 1; font-family: 'Segoe UI', monospace; text-align: center; }
        .date-text { font-size: clamp(7.5px, 0.6vw, 9.5px); font-weight: 600; color: #bbb; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.2px; text-align: center; transition: color 0.4s ease; }
        
        /* SAĞ KONTROL BUTONLARI (GPS VE MOD DEĞİŞTİRME) */
        .right-controls { position: fixed; top: clamp(85px, 12vh, 110px); right: clamp(15px, 1.5vw, 25px); z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .control-btn { 
            background-color: rgba(40, 40, 40, 0.8); border: 1px solid rgba(46, 204, 113, 0.5); backdrop-filter: blur(10px); 
            color: #2ecc71; width: clamp(40px, 4vw, 50px); height: clamp(40px, 4vw, 50px); border-radius: 50%; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            transition: all 0.2s; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4); 
        }
        .control-btn:hover { background-color: rgba(46, 204, 113, 0.2); transform: scale(1.1); color: #fff; }
        .control-btn:active { transform: scale(0.9); }
        .control-btn svg { width: 50%; height: 50%; }
        .theme-btn { border-color: rgba(255, 255, 255, 0.3); color: #f1c40f; font-size: 20px; }
        .theme-btn:hover { background-color: rgba(255, 255, 255, 0.1); color: #fff; }

        /* EŞİT BOYUTLU KUTUCUKLAR */
        .excel-kutu-container { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(8px, 1vw, 12px); margin-top: clamp(10px, 1.5vh, 15px); }
        .veri-kutusu { 
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; 
            padding: clamp(8px, 1vh, 12px); text-align: center; position: relative; cursor: pointer; transition: all 0.3s ease; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: clamp(65px, 8vh, 85px); 
        }
        .veri-kutusu:hover { background: rgba(255, 255, 255, 0.08); }
        .veri-kutusu:active { transform: scale(0.92); }
        .veri-baslik { font-size: clamp(8px, 0.7vw, 11px); color: #999; text-transform: uppercase; margin-bottom: 6px; pointer-events: none; transition: color 0.4s ease; }
        .veri-deger-container { display: flex; align-items: center; justify-content: center; gap: 6px; pointer-events: none; }
        .veri-deger { font-size: clamp(14px, 1.2vw, 18px); font-weight: 600; color: #ffffff; transition: color 0.4s ease; }
        .trend-up { color: #2ecc71; font-size: clamp(12px, 1vw, 14px); }
        .trend-down { color: #e74c3c; font-size: clamp(12px, 1vw, 14px); }
        .trend-flat { color: #95a5a6; font-size: clamp(12px, 1vw, 14px); }

        .veri-kutusu.tam-genislik { grid-column: span 2; background: linear-gradient(135deg, rgba(46, 204, 113, 0.15) 0%, rgba(46, 204, 113, 0.02) 100%); border: 1px solid rgba(46, 204, 113, 0.3); }
        .veri-kutusu.tam-genislik .veri-baslik { color: #2ecc71; font-weight: bold; letter-spacing: 1px; }
        .veri-kutusu.tam-genislik .veri-deger { font-size: clamp(18px, 1.6vw, 24px); }

        /* MODAL GRAFİK */
        #iosModal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 9999; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        #iosModal.show { opacity: 1; }
        #iosModalContent { width: 90%; max-width: clamp(400px, 50vw, 750px); height: clamp(300px, 50vh, 500px); background: rgba(30, 30, 30, 0.85); border-radius: 24px; border: 1px solid rgba(255,255,255,0.15); padding: clamp(15px, 2vw, 25px); box-shadow: 0 25px 50px rgba(0,0,0,0.5); transform: scale(0); opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.2); position: relative; display: flex; flex-direction: column; }
        #iosModal.show #iosModalContent { transform: scale(1); opacity: 1; }
        .modal-baslik { color: white; margin: 0 0 clamp(10px, 1.5vh, 15px) 0; font-size: clamp(16px, 1.5vw, 20px); font-weight: 600; transition: color 0.4s ease; }
        .close-btn { position: absolute; top: clamp(15px, 2vh, 20px); right: clamp(15px, 2vw, 25px); color: #aaa; font-size: clamp(24px, 2vw, 28px); cursor: pointer; font-weight: bold; transition: color 0.2s; line-height: 1; }
        .close-btn:hover { color: #fff; }
        .chart-container { flex-grow: 1; position: relative; width: 100%; }

        /* LEAFLET ÖZELLEŞTİRMELERİ */
        .marker-cluster-small { background-color: rgba(46, 204, 113, 0.6); }
        .marker-cluster-small div { background-color: rgba(46, 204, 113, 0.8); color: #fff; font-weight: bold; font-size: clamp(10px, 0.8vw, 12px); }
        .leaflet-popup-content-wrapper { background-color: rgba(25, 25, 25, 0.95) !important; backdrop-filter: blur(8px); color: #e0e0e0 !important; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); transition: all 0.4s ease; }
        .agac-popup-baslik { font-size: clamp(12px, 1vw, 14px); font-weight: 600; color: #2ecc71; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 6px; margin-bottom: 8px; }
